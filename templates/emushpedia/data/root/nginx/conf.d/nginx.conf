map $cookie_emushpedia_lang $cookie_lang {
    default "";
    fr fr;
    en en;
    es es;
}

map $http_accept_language $header_lang {
    default en;
    ~*fr fr;
    ~*es es;
    ~*en en;
}

map $cookie_lang $redirect_lang {
    default $header_lang;
    ~^(fr|en|es)$ $cookie_lang;
}

server {
    listen 80;
    server_name emushpedia.com;

    location = / {
        return 302 https://$redirect_lang.emushpedia.com/;
    }

    location / {
        return 302 https://$redirect_lang.emushpedia.com$request_uri;
    }
}


