# Crawl-trap protection: anonymous visitors (no MediaWiki UserID cookie) cannot
# reach endless URL spaces (diffs, history, linked changes, nested login returnto).
map $http_cookie $mw_logged_in {
    default                             0;
    "~(^|;\s*)[A-Za-z0-9_]*UserID=\d"   1;
}

map $args $mw_trap {
    default                                                 0;
    "~(^|&)returntoquery=[^&]"                              2;
    "~(^|&)(diff|oldid)="                                   1;
    "~(^|&)action=(history|edit|info)"                      1;
    "~*Suivi(_|\+|%20)des(_|\+|%20)liens|Pages(_|\+|%20)li" 1;
    "~*CambiosEnEnlazadas|LoQueEnlazaAqu"                   1;
    "~*RecentChangesLinked|WhatLinksHere"                   1;
}

server {
    listen 80;
    server_name _;

    # Increase limits for uploads
    client_max_body_size 100M;
    limit_rate 1M;

    # Redirect old /index.php/Page URLs to /wiki/Page
    location ~ ^/index\.php/(.*)$ {
        return 301 /wiki/$1$is_args$args;
    }

    # Short URL entry point: /wiki/Page -> /index.php?title=Page
    location /wiki/ {
        rewrite ^/wiki/(.*)$ /index.php?title=$1 last;
    }

    # Ask bot to not crawl
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: GPTBot\nDisallow: /\n\nUser-agent: *\nDisallow: /index.php\nDisallow: /api.php\nDisallow: /wiki/Special:\nDisallow: /wiki/Spécial:\nDisallow: /wiki/Sp%C3%A9cial:\n";
    }

    # Everything else goes to the MediaWiki container
    location / {
        # Explicitly disallow GPTBot
        if ($http_user_agent ~* "GPTBot") {
            return 403;
        }

        # Crawl traps for anonymous GET/HEAD (see maps above): 403, or strip
        # returntoquery from login links to stop the endless nesting
        set $mw_block "$mw_trap$mw_logged_in$request_method";
        if ($mw_block ~ "^10(GET|HEAD)$") {
            return 403;
        }
        if ($mw_block ~ "^20(GET|HEAD)$") {
            return 302 https://$host/index.php?title=$arg_title&returnto=$arg_returnto;
        }

        proxy_pass http://emushpedia-mediawiki-fr:80;

        # Preserve client/proxy info
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # WebSocket support (safe to include)
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
