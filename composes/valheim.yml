services:
  valheim:
    container_name: "${COMPOSE_ENV}"
    image: ghcr.io/community-valheim-tools/valheim-server
    cap_add:
      - sys_nice
    volumes:
      - ../live/${COMPOSE_ENV}/config:/config
      - ../live/${COMPOSE_ENV}/data:/opt/valheim
    ports:
      - "2456-2458:2456-2458/udp"
      - "9001:9001/tcp"
    env_file: "../live/${COMPOSE_ENV}/.env"
    restart: unless-stopped
    stop_grace_period: 2m

