services:

  emushpedia-mysql:
    image: mysql:9.6.0
    container_name: ${COMPOSE_ENV}-mysql
    restart: unless-stopped
    env_file: "../live/${COMPOSE_ENV}/.env"
    volumes:
      - ../live/${COMPOSE_ENV}/data/mysql:/var/lib/mysql
      - ../live/${COMPOSE_ENV}/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web

  emushpedia-opensearch:
    build:
      context: ../live/${COMPOSE_ENV}/opensearch
      dockerfile: Dockerfile
    container_name: ${COMPOSE_ENV}-opensearch
    restart: unless-stopped
    environment:
      cluster.name: ${COMPOSE_ENV}-cirrus
      node.name: ${COMPOSE_ENV}-opensearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      # Safe only because the service remains on an internal Docker network.
      DISABLE_SECURITY_PLUGIN: "true"
    mem_limit: 2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ../live/${COMPOSE_ENV}/data/opensearch:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - search

  emushpedia-mediawiki-fr:
    image: mediawiki:1.46.2
    container_name: ${COMPOSE_ENV}-mediawiki-fr
    restart: unless-stopped
    depends_on:
      emushpedia-mysql:
        condition: service_healthy
      emushpedia-opensearch:
        condition: service_healthy
    volumes:
      - ../live/${COMPOSE_ENV}/data/fr/images:/var/www/html/images
      - ../live/${COMPOSE_ENV}/data/fr/LocalSettings.php:/var/www/html/LocalSettings.php
      - ../live/${COMPOSE_ENV}/data/extensions:/var/www/html/extensions/non-core/
      - ../live/${COMPOSE_ENV}/data/extensions/Elastica:/var/www/html/extensions/Elastica:ro
      - ../live/${COMPOSE_ENV}/data/extensions/CirrusSearch:/var/www/html/extensions/CirrusSearch:ro
      - ../live/${COMPOSE_ENV}/data/extensions/OAuth:/var/www/html/extensions/OAuth:ro
      - ../live/${COMPOSE_ENV}/data/oauth2:/var/www/html/oauth2
      - ../live/${COMPOSE_ENV}/data/fr/favicon.ico:/var/www/html/favicon.ico
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web
      - search

  emushpedia-mediawiki-en:
    image: mediawiki:1.46.2
    container_name: ${COMPOSE_ENV}-mediawiki-en
    restart: unless-stopped
    depends_on:
      emushpedia-mysql:
        condition: service_healthy
      emushpedia-opensearch:
        condition: service_healthy
    volumes:
      - ../live/${COMPOSE_ENV}/data/en/images:/var/www/html/images
      - ../live/${COMPOSE_ENV}/data/en/LocalSettings.php:/var/www/html/LocalSettings.php
      - ../live/${COMPOSE_ENV}/data/en/favicon.ico:/var/www/html/favicon.ico
      - ../live/${COMPOSE_ENV}/data/extensions:/var/www/html/extensions/non-core/
      - ../live/${COMPOSE_ENV}/data/extensions/Elastica:/var/www/html/extensions/Elastica:ro
      - ../live/${COMPOSE_ENV}/data/extensions/CirrusSearch:/var/www/html/extensions/CirrusSearch:ro
      - ../live/${COMPOSE_ENV}/data/extensions/OAuth:/var/www/html/extensions/OAuth:ro
      - ../live/${COMPOSE_ENV}/data/oauth2:/var/www/html/oauth2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web
      - search

  emushpedia-mediawiki-es:
    image: mediawiki:1.46.2
    container_name: ${COMPOSE_ENV}-mediawiki-es
    restart: unless-stopped
    depends_on:
      emushpedia-mysql:
        condition: service_healthy
      emushpedia-opensearch:
        condition: service_healthy
    volumes:
      - ../live/${COMPOSE_ENV}/data/es/images:/var/www/html/images
      - ../live/${COMPOSE_ENV}/data/es/LocalSettings.php:/var/www/html/LocalSettings.php
      - ../live/${COMPOSE_ENV}/data/es/favicon.ico:/var/www/html/favicon.ico
      - ../live/${COMPOSE_ENV}/data/extensions:/var/www/html/extensions/non-core/
      - ../live/${COMPOSE_ENV}/data/extensions/Elastica:/var/www/html/extensions/Elastica:ro
      - ../live/${COMPOSE_ENV}/data/extensions/CirrusSearch:/var/www/html/extensions/CirrusSearch:ro
      - ../live/${COMPOSE_ENV}/data/extensions/OAuth:/var/www/html/extensions/OAuth:ro
      - ../live/${COMPOSE_ENV}/data/oauth2:/var/www/html/oauth2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web
      - search

  emushpedia-nginx-fr:
    image: nginx:stable-alpine
    container_name: ${COMPOSE_ENV}-nginx-fr
    restart: unless-stopped
    depends_on:
      emushpedia-mediawiki-fr:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ../live/${COMPOSE_ENV}/data/fr/nginx/conf.d:/etc/nginx/conf.d:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      # Pages: rate-limited per client IP
      - "traefik.http.routers.${COMPOSE_ENV}-fr.rule=${TRAEFIK_RULE_FR}"
      - "traefik.http.routers.${COMPOSE_ENV}-fr.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_ENV}-fr.tls=true"
      - "traefik.http.routers.${COMPOSE_ENV}-fr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_ENV}-fr.service=${COMPOSE_ENV}-fr"
      - "traefik.http.routers.${COMPOSE_ENV}-fr.middlewares=${COMPOSE_ENV}-fr-rate@docker,${COMPOSE_ENV}-fr-concurrent@docker"

      # Static assets (images, CSS/JS, skins): not rate-limited, a single page loads many of them
      - "traefik.http.routers.${COMPOSE_ENV}-fr-static.rule=${TRAEFIK_RULE_FR} && (PathPrefix(`/images/`) || PathPrefix(`/resources/`) || PathPrefix(`/skins/`) || PathPrefix(`/extensions/`) || Path(`/load.php`) || Path(`/favicon.ico`))"
      - "traefik.http.routers.${COMPOSE_ENV}-fr-static.priority=100"
      - "traefik.http.routers.${COMPOSE_ENV}-fr-static.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_ENV}-fr-static.tls=true"
      - "traefik.http.routers.${COMPOSE_ENV}-fr-static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_ENV}-fr-static.service=${COMPOSE_ENV}-fr"

      - "traefik.http.services.${COMPOSE_ENV}-fr.loadbalancer.server.port=80"

      - "traefik.http.middlewares.${COMPOSE_ENV}-fr-rate.ratelimit.average=10"
      - "traefik.http.middlewares.${COMPOSE_ENV}-fr-rate.ratelimit.period=1s"
      - "traefik.http.middlewares.${COMPOSE_ENV}-fr-rate.ratelimit.burst=50"
      - "traefik.http.middlewares.${COMPOSE_ENV}-fr-concurrent.inflightreq.amount=10"
    networks:
      - web

  emushpedia-nginx-en:
    image: nginx:stable-alpine
    container_name: ${COMPOSE_ENV}-nginx-en
    restart: unless-stopped
    depends_on:
      emushpedia-mediawiki-en:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ../live/${COMPOSE_ENV}/data/en/nginx/conf.d:/etc/nginx/conf.d:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      # Pages: rate-limited per client IP
      - "traefik.http.routers.${COMPOSE_ENV}-en.rule=${TRAEFIK_RULE_EN}"
      - "traefik.http.routers.${COMPOSE_ENV}-en.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_ENV}-en.tls=true"
      - "traefik.http.routers.${COMPOSE_ENV}-en.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_ENV}-en.service=${COMPOSE_ENV}-en"
      - "traefik.http.routers.${COMPOSE_ENV}-en.middlewares=${COMPOSE_ENV}-en-rate@docker,${COMPOSE_ENV}-en-concurrent@docker"

      # Static assets (images, CSS/JS, skins): not rate-limited, a single page loads many of them
      - "traefik.http.routers.${COMPOSE_ENV}-en-static.rule=${TRAEFIK_RULE_EN} && (PathPrefix(`/images/`) || PathPrefix(`/resources/`) || PathPrefix(`/skins/`) || PathPrefix(`/extensions/`) || Path(`/load.php`) || Path(`/favicon.ico`))"
      - "traefik.http.routers.${COMPOSE_ENV}-en-static.priority=100"
      - "traefik.http.routers.${COMPOSE_ENV}-en-static.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_ENV}-en-static.tls=true"
      - "traefik.http.routers.${COMPOSE_ENV}-en-static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_ENV}-en-static.service=${COMPOSE_ENV}-en"

      - "traefik.http.services.${COMPOSE_ENV}-en.loadbalancer.server.port=80"

      - "traefik.http.middlewares.${COMPOSE_ENV}-en-rate.ratelimit.average=10"
      - "traefik.http.middlewares.${COMPOSE_ENV}-en-rate.ratelimit.period=1s"
      - "traefik.http.middlewares.${COMPOSE_ENV}-en-rate.ratelimit.burst=50"
      - "traefik.http.middlewares.${COMPOSE_ENV}-en-concurrent.inflightreq.amount=10"
    networks:
      - web

  emushpedia-nginx-es:
    image: nginx:stable-alpine
    container_name: ${COMPOSE_ENV}-nginx-es
    restart: unless-stopped
    depends_on:
      emushpedia-mediawiki-es:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ../live/${COMPOSE_ENV}/data/es/nginx/conf.d:/etc/nginx/conf.d:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      # Pages: rate-limited per client IP
      - "traefik.http.routers.${COMPOSE_ENV}-es.rule=${TRAEFIK_RULE_ES}"
      - "traefik.http.routers.${COMPOSE_ENV}-es.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_ENV}-es.tls=true"
      - "traefik.http.routers.${COMPOSE_ENV}-es.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_ENV}-es.service=${COMPOSE_ENV}-es"
      - "traefik.http.routers.${COMPOSE_ENV}-es.middlewares=${COMPOSE_ENV}-es-rate@docker,${COMPOSE_ENV}-es-concurrent@docker"

      # Static assets (images, CSS/JS, skins): not rate-limited, a single page loads many of them
      - "traefik.http.routers.${COMPOSE_ENV}-es-static.rule=${TRAEFIK_RULE_ES} && (PathPrefix(`/images/`) || PathPrefix(`/resources/`) || PathPrefix(`/skins/`) || PathPrefix(`/extensions/`) || Path(`/load.php`) || Path(`/favicon.ico`))"
      - "traefik.http.routers.${COMPOSE_ENV}-es-static.priority=100"
      - "traefik.http.routers.${COMPOSE_ENV}-es-static.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_ENV}-es-static.tls=true"
      - "traefik.http.routers.${COMPOSE_ENV}-es-static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_ENV}-es-static.service=${COMPOSE_ENV}-es"

      - "traefik.http.services.${COMPOSE_ENV}-es.loadbalancer.server.port=80"

      - "traefik.http.middlewares.${COMPOSE_ENV}-es-rate.ratelimit.average=10"
      - "traefik.http.middlewares.${COMPOSE_ENV}-es-rate.ratelimit.period=1s"
      - "traefik.http.middlewares.${COMPOSE_ENV}-es-rate.ratelimit.burst=50"
      - "traefik.http.middlewares.${COMPOSE_ENV}-es-concurrent.inflightreq.amount=10"
    networks:
      - web

  emushpedia-nginx-root:
    image: nginx:stable-alpine
    container_name: ${COMPOSE_ENV}-nginx-root
    restart: unless-stopped
    depends_on:
      emushpedia-mediawiki-fr:
        condition: service_healthy
      emushpedia-mediawiki-en:
        condition: service_healthy
      emushpedia-mediawiki-es:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ../live/${COMPOSE_ENV}/data/root/nginx/conf.d:/etc/nginx/conf.d:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      - "traefik.http.routers.${COMPOSE_ENV}-root.rule=${TRAEFIK_RULE_ROOT}"
      - "traefik.http.routers.${COMPOSE_ENV}-root.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_ENV}-root.tls=true"
      - "traefik.http.routers.${COMPOSE_ENV}-root.tls.certresolver=letsencrypt"
      - "traefik.http.services.${COMPOSE_ENV}-root.loadbalancer.server.port=80"
    networks:
      - web

  emushpedia-mail:
    image: boky/postfix:latest
    container_name: ${COMPOSE_ENV}-mail
    restart: unless-stopped
    environment:
      HOSTNAME: ${COMPOSE_ENV}-mail
      ALLOWED_SENDER_DOMAINS: emushpedia.com
      POSTFIX_myhostname: mail.emushpedia.com
      POSTFIX_mydomain: emushpedia.com
      POSTFIX_INET_PROTOCOLS: ipv4
    volumes:
      - ../live/emushpedia/data/mail/keys:/etc/opendkim/keys
    networks:
      - web

networks:
  web:
    external: true
    name: web
  search:
    internal: true
